<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
		<title>World Database Lookup</title>
		<link href="world.css" type="text/css" rel="stylesheet" />
		<script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
		<script src="world.js" type="text/javascript"></script>
	</head>

	<body>
		<header>
			<img src="world.png" alt="Outline of the countries of the world"/>
			<h1>World Database Lookup</h1>
		</header>
		<main>
			<div id="controls">
				<div id="container">
					<label for="country">Country:</label>
					<input id="country" type="search" name="country" placeholder="Enter country name" />
				</div>
				<div id="searches">
					<button id="lookup">Lookup Country</button>
					<button id="cities">Lookup Cities</button>
				</div>
			</div>
			<div id="result"></div>
		</main>

	</body>
</html>
